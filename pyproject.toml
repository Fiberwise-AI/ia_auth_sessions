[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-auth-sessions"
version = "0.1.0"
description = "Industry-standard session-based authentication for FastAPI with secure cookies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Fiberwise AI"}
]
keywords = ["fastapi", "authentication", "sessions", "cookies", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.104.0",
    "itsdangerous>=2.1.0",  # Industry standard for secure session signing
    "passlib[bcrypt]>=1.7.4",  # Industry standard for password hashing
    "bcrypt>=5.0.0",  # Pin to 4.x for passlib compatibility
    "nexusql>=0.1.0",  # Database abstraction
    "python-multipart>=0.0.6",  # For form data
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/fiberwise-ai/ia_auth_sessions"
Documentation = "https://github.com/fiberwise-ai/ia_auth_sessions/blob/main/README.md"
Repository = "https://github.com/fiberwise-ai/ia_auth_sessions"

[tool.setuptools.packages.find]
where = ["."]
include = ["ia_auth_sessions*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:nexusql.*:",
]
